[package]
name = "pdt-walker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_walker"
crate-type = ["cdylib"]

[dependencies]
# PyO3 0.30 supports CPython 3.8-3.14; 0.23 stopped at 3.13. generate-import-lib lets a
# cross-build for Windows (ARM64 on an x64 host) link without the target Python's libraries.
pyo3 = { version = "=0.30.1", features = ["extension-module", "generate-import-lib"] }
