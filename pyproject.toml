[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.10"]
build-backend = "setuptools.build_meta"

[project]
name = "project-discovery-tool"
version = "0.1.0"
description = "Local-first project intelligence and architecture analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.7", "packaging>=23"]

[project.scripts]
pdt = "project_discovery.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "build>=1.2",
    "twine>=5.0",
    "PyYAML>=6.0,<7",
    "setuptools-rust>=1.10",
]
polyglot = ["tree-sitter-language-pack>=1.23,<2"]
infrastructure = ["PyYAML>=6.0,<7"]
documents = ["pypdf>=5,<7", "python-docx>=1.1,<2"]
all = [
    "tree-sitter-language-pack>=1.23,<2",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.setuptools.package-data]
project_discovery = ["web/*.js", "data/*.txt"]
