name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install "ruff>=0.5"
      # Syntax errors, undefined names, unused/shadowed definitions (F811 caught
      # duplicate test functions), likely bugs (flake8-bugbear) and pylint errors.
      - name: Static correctness checks
        run: ruff check . --select E9,F,B,PLE

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Build C, C++, Rust and (Linux x86-64) Assembly backends
        run: python setup.py build_ext --inplace
      - name: Report native backend status
        run: python -c "from project_discovery.native_backend import capabilities; import json; print(json.dumps(capabilities(), indent=1, sort_keys=True))"
      - name: Run test suite with coverage gate
        run: pytest --cov=project_discovery --cov-report=term-missing --cov-fail-under=80
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check dist/*
      - name: Install wheel and smoke-test the console entry point
        shell: bash
        run: |
          python -c "import glob,subprocess,sys; wheel=glob.glob('dist/*.whl')[0]; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',wheel])"
          pdt --version
          pdt --help
          pdt scan --help
          mkdir -p "$RUNNER_TEMP/smoke"
          printf 'import os\nos.system("id")\n' > "$RUNNER_TEMP/smoke/app.py"
          pdt scan "$RUNNER_TEMP/smoke" --output "$RUNNER_TEMP/smoke-report" --quiet --strict
          test -s "$RUNNER_TEMP/smoke-report/discovery-report.json"

  optional-integrations:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with every optional integration
        run: python -m pip install -e ".[dev,all]"
      - name: Run test suite with Tree-sitter, PDF, DOCX and YAML integrations
        run: pytest
