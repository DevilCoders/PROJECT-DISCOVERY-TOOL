name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run test suite with coverage gate
        run: pytest --cov=project_discovery --cov-report=term-missing --cov-fail-under=80
      - name: Critical static correctness checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check dist/*
