name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Build portable C and optional x86-64 Assembly backend
        run: python setup.py build_ext --inplace
      - name: Run test suite with coverage gate
        run: pytest --cov=project_discovery --cov-report=term-missing --cov-fail-under=80
      - name: Critical static correctness checks
        run: ruff check . --select E9,F63,F7,F82
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate distribution metadata
        shell: bash
        run: python -m twine check dist/*
      - name: Install wheel and smoke-test the console entry point
        shell: bash
        run: |
          python -c "import glob,subprocess,sys; wheel=glob.glob('dist/*.whl')[0]; subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',wheel])"
          pdt --version
          pdt --help
          pdt scan --help
